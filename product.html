<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle - Aurea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

  <header class="cabecera">
    <div class="contenedor">
      <a href="index.html" class="logo">
        <img src="./img/logo.jpg" alt="Logo de Aurea">
        <span class="logo-texto">Aurea</span>
      </a>
      <nav>
        <ul class="menu">
          <li><a href="index.html">Home</a></li>
          <li id="item-login"><a href="login.html">Login</a></li>
          <li id="item-registro"><a href="register.html">Registro</a></li>
          <li id="saludo">Bienvenido: <span id="email-usuario"></span></li>
          <li id="item-logout"><a href="#" id="logout">logout</a></li>
        </ul>
      </nav>
      <form class="buscador" id="form-buscador" action="search-results.html" method="get">
        <input type="text" name="busqueda" id="campo-busqueda" placeholder="Buscar productos">
        <button type="submit">Buscar</button>
      </form>
      <p class="error error-busqueda" id="error-busqueda"></p>
    </div>
  </header>

  <div class="contenedor cuerpo">

    <aside class="categorias">
      <h2>Categorías</h2>
      <ul id="lista-categorias">
      </ul>
    </aside>

    <main class="principal">

      <section class="detalle">
        <div class="detalle-foto">
          <img src="" alt="" id="foto">
        </div>
        <div class="detalle-info">
          <p class="marca" id="marca"></p>
          <h1 id="nombre"></h1>
          <p class="precio-grande" id="precio"></p>
          <p class="descripcion" id="descripcion"></p>
          <p class="dato"><strong>Categoría:</strong> <a href="#" id="categoria"></a></p>
          <p class="dato"><strong>Stock:</strong> <span id="stock"></span></p>
          <ul class="tags" id="tags">
          </ul>
        </div>
      </section>

      <section class="seccion">
        <h2 class="titulo-seccion">Reviews</h2>
        <div id="reviews">
        </div>
      </section>

    </main>

  </div>

  <footer class="pie">
    <div class="contenedor">
      <p class="pie-marca">Aurea · Tienda online</p>
      <ul class="integrantes">
        <li>Carnevale Isabella</li>
        <li>Goity Zapico Felicitas</li>
        <li>Otero Alen Bautista</li>
      </ul>
    </div>
  </footer>
  <script src="./js/categorias.js"></script>
</body>
</html>
